name: Build COC-LIO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}.0
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Verify GitHub runner
        shell: bash
        run: |
          echo "Runner is online."
          uname -a
          df -h .
          java -version || true

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Firebase and Google OAuth configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          with open("app/google-services.json", "r", encoding="utf-8") as file:
              config = json.load(file)

          project = config.get("project_info", {})
          project_id = project.get("project_id", "")
          project_number = str(project.get("project_number", ""))
          clients = config.get("client", [])
          package_name = "com.huyhoa.coclio"
          has_package = any(
              item.get("client_info", {}).get("android_client_info", {}).get("package_name") == package_name
              for item in clients
          )
          raw_web_client_id = os.environ.get("GOOGLE_WEB_CLIENT_ID", "")
          web_client_id = raw_web_client_id.strip()

          if raw_web_client_id != web_client_id:
              sys.exit("::error::GOOGLE_WEB_CLIENT_ID có khoảng trắng ở đầu hoặc cuối.")

          if project_id != "coc-lio-73de9" or project_number != "854984158580":
              sys.exit("::error::google-services.json không thuộc Firebase project COC-LIO.")
          if not has_package:
              sys.exit("::error::google-services.json không có Android package com.huyhoa.coclio.")
          if not re.fullmatch(r"[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com", web_client_id):
              sys.exit("::error::GOOGLE_WEB_CLIENT_ID thiếu hoặc sai định dạng Client ID.")
          if not web_client_id.startswith(project_number + "-"):
              sys.exit("::error::GOOGLE_WEB_CLIENT_ID không thuộc cùng project number với Firebase COC-LIO.")

          print("Firebase project, Android package and OAuth Client ID project prefix are consistent.")
          print("Lưu ý: cần xác nhận thủ công OAuth Client ID này có loại Web application trong Google Cloud Console.")
          PY

      - name: Prepare Android signing key
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/coclio-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release signing key is configured."
          else
            echo "::error::Release signing secrets are incomplete. Add all Android signing secrets before building."
            exit 1
          fi

      - name: Print release signing certificate fingerprints
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          echo "Android package: com.huyhoa.coclio"
          FINGERPRINTS="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk '/SHA1:|SHA256:/ { print }')"
          if ! grep -q 'SHA1:' <<< "$FINGERPRINTS"; then
            echo "::error::Could not read SHA-1 fingerprint from the release signing certificate."
            exit 1
          fi
          echo "$FINGERPRINTS"

      - name: Run unit tests
        run: gradle --no-daemon --build-cache --parallel testDebugUnitTest

      - name: Build signed release APK
        run: gradle --no-daemon --build-cache assembleRelease

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/COC-LIO-v${VERSION_NAME}.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: COC-LIO-v${{ env.VERSION_NAME }}
          path: artifacts/COC-LIO-v*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
