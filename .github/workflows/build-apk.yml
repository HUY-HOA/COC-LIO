name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: coc-lio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate app version
        id: version
        shell: bash
        run: |
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building COC-LIO $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Build APK
        run: |
          gradle --build-cache --parallel assembleDebug \
            -PVERSION_CODE=${{ steps.version.outputs.code }} \
            -PVERSION_NAME=${{ steps.version.outputs.name }}

      - name: Verify APK and calculate checksum
        id: apk
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COC-LIO-v${{ steps.version.outputs.name }}-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## COC-LIO APK"
            echo "- Version: ${{ steps.version.outputs.name }}"
            echo "- versionCode: ${{ steps.version.outputs.code }}"
            echo "- Variant: debug"
            echo "- APK: app-debug.apk"
            echo "- SHA-256:"
            cat apk-sha256.txt
          } >> "$GITHUB_STEP_SUMMARY"
