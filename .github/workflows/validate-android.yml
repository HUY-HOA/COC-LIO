name: Validate Android sources

on:
  push:
    branches:
      - main
    paths:
      - "app/src/main/**/*.kt"
      - "app/src/main/assets/coc_upgrade/*.json"
      - "app/src/test/**/*.kt"
      - ".github/workflows/validate-android.yml"
      - ".github/scripts/validate_coc_catalog.py"
      - "remote-content/catalog/*.json"

permissions:
  contents: read

concurrency:
  group: validate-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate game data JSON and ID mappings
        run: python3 .github/scripts/validate_coc_catalog.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate source, tests and release resources
        run: gradle --no-daemon --build-cache --parallel --console=plain lintDebug testDebugUnitTest compileReleaseKotlin processReleaseResources
