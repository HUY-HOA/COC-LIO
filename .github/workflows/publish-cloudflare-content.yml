name: Publish COC-LIO Content to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "remote-content/current.json"
      - "remote-content/catalog/*.json"
      - "cloudflare/worker/src/index.mjs"
      - ".github/workflows/publish-cloudflare-content.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coc-lio-cloudflare-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b1e6af9f0ef491fb7557747974a863f9
      CLOUDFLARE_KV_NAMESPACE_ID: e809595b32304b18ab21f60bbfb506cf
      CLOUDFLARE_WORKER_NAME: coc-lio-remote-content
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Cloudflare Worker
        run: node --test cloudflare/worker/test/index.test.mjs

      - name: Explain skipped Cloudflare publishing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice::Cloudflare source and Worker tests passed. Current KV content is checked against the repository. Add the CLOUDFLARE_API_TOKEN Actions secret to publish future content changes automatically."

      - name: Deploy Worker and publish versioned content
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { createHash } = require("node:crypto");

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const namespaceId = process.env.CLOUDFLARE_KV_NAMESPACE_ID;
          const workerName = process.env.CLOUDFLARE_WORKER_NAME;
          const apiRoot = "https://api.cloudflare.com/client/v4";

          async function checkResponse(response, label) {
            let body;
            try {
              body = await response.json();
            } catch {
              throw new Error(label + " returned a non-JSON response.");
            }
            if (!response.ok || body.success !== true) {
              throw new Error(label + " failed: " + JSON.stringify(body.errors || body));
            }
            return body;
          }

          async function api(method, route, body) {
            const response = await fetch(apiRoot + route, {
              method,
              headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json"
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            return checkResponse(response, method + " " + route);
          }

          async function putValue(key, value) {
            const route = "/accounts/" + accountId + "/storage/kv/namespaces/" +
              namespaceId + "/values/" + encodeURIComponent(key);
            const response = await fetch(apiRoot + route, {
              method: "PUT",
              headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json"
              },
              body: value
            });
            await checkResponse(response, "Publish KV key " + key);
          }

          async function main() {
            const workerSource = fs.readFileSync("cloudflare/worker/src/index.mjs", "utf8");
            const metadata = {
              main_module: "index.mjs",
              compatibility_date: "2026-11-15",
              bindings: [
                {
                  type: "kv_namespace",
                  name: "CONTENT",
                  namespace_id: namespaceId
                }
              ],
              observability: {
                enabled: true,
                head_sampling_rate: 0.1,
                logs: {
                  enabled: true,
                  invocation_logs: true,
                  persist: true,
                  head_sampling_rate: 0.1
                },
                traces: {
                  enabled: true,
                  persist: true,
                  head_sampling_rate: 0.1
                }
              }
            };

            const form = new FormData();
            form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
            form.append("files", new Blob([workerSource], { type: "application/javascript+module" }), "index.mjs");

            const workerRoute = "/accounts/" + accountId + "/workers/scripts/" + workerName;
            const upload = await fetch(apiRoot + workerRoute, {
              method: "PUT",
              headers: { Authorization: "Bearer " + token },
              body: form
            });
            await checkResponse(upload, "Deploy Cloudflare Worker");

            await api("POST", workerRoute + "/subdomain", {
              enabled: true,
              previews_enabled: false
            });

            const source = JSON.parse(fs.readFileSync("remote-content/current.json", "utf8"));
            const shardNames = source.catalogShards || [];
            if (!Array.isArray(shardNames) || shardNames.length > 100 ||
                shardNames.some(name => typeof name !== "string" || !/^part-\d{2}\.json$/.test(name)) ||
                new Set(shardNames).size !== shardNames.length) {
              throw new Error("Remote content shard manifest is invalid.");
            }

            const seenIds = new Set();
            for (const item of source.catalog || []) {
              const id = Number(item && item.dataId);
              if (!Number.isSafeInteger(id) || id < 1 || seenIds.has(id) ||
                  !String(item && item.name || "").trim()) {
                throw new Error("Base catalog contains an invalid or duplicate dataId.");
              }
              seenIds.add(id);
            }

            for (const name of shardNames) {
              const shardPath = path.join("remote-content", "catalog", name);
              if (!fs.existsSync(shardPath)) {
                throw new Error("Catalog shard is missing: " + name);
              }
              const shard = JSON.parse(fs.readFileSync(shardPath, "utf8"));
              if (!Array.isArray(shard.catalog)) {
                throw new Error("Catalog shard " + name + " has no catalog array.");
              }
              for (const item of shard.catalog) {
                const id = Number(item && item.dataId);
                if (!Number.isSafeInteger(id) || id < 1 || seenIds.has(id) ||
                    !String(item && item.name || "").trim()) {
                  throw new Error("Catalog shard " + name + " contains an invalid or duplicate dataId.");
                }
                seenIds.add(id);
                source.catalog.push(item);
              }
            }

            if (!Number.isInteger(source.version) || source.version < 1 ||
                typeof source.enabled !== "boolean" ||
                !Array.isArray(source.catalog) || source.catalog.length < 1 ||
                source.catalog.length > 500 ||
                !Array.isArray(source.guides) || source.guides.length > 20 ||
                !Array.isArray(source.links) || source.links.length > 20) {
              throw new Error("Remote content schema or item limits are invalid.");
            }

            delete source.catalogShards;
            const payload = JSON.stringify(source);
            const byteLength = Buffer.byteLength(payload, "utf8");
            if (byteLength > 20 * 1024 * 1024) {
              throw new Error("Remote content exceeds the safe 20 MiB Cloudflare KV publication limit.");
            }

            const sha256 = createHash("sha256").update(payload, "utf8").digest("hex");
            const versionKey = "content/v" + source.version + ".json";
            await putValue(versionKey, payload);
            await putValue("content/current", JSON.stringify({
              version: source.version,
              key: versionKey,
              sha256,
              publishedAt: new Date().toISOString()
            }));

            console.log("Cloudflare Worker deployed:", workerName);
            console.log("Content version:", source.version);
            console.log("Catalog entries:", source.catalog.length);
            console.log("Catalog shards:", shardNames.length);
            console.log("Content bytes:", byteLength);
            console.log("SHA-256:", sha256);
            console.log("Published immutable version before updating the current pointer.");
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify deployed Worker and compare with repository source
        shell: bash
        env:
          WORKER_URL: https://coc-lio-remote-content.coc-lio-data.workers.dev
        run: |
          set -euo pipefail
          curl --retry 10 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS "$WORKER_URL/health"
          printf '\\n'
          RESPONSE_CODE="$(curl --retry 10 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 90 -sS -D "$RUNNER_TEMP/coclio-cloudflare-headers.txt" -o "$RUNNER_TEMP/coclio-cloudflare-content.json" -w '%{http_code}' "$WORKER_URL/v1/content")"
          if [[ "$RESPONSE_CODE" != "200" ]]; then
            echo "::error::Cloudflare catalog endpoint returned HTTP $RESPONSE_CODE."
            cat "$RUNNER_TEMP/coclio-cloudflare-content.json" || true
            exit 1
          fi
          python3 - "$RUNNER_TEMP/coclio-cloudflare-headers.txt" "$RUNNER_TEMP/coclio-cloudflare-content.json" remote-content/current.json remote-content/catalog <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          headers = {}
          with open(sys.argv[1], encoding="utf-8") as handle:
              for line in handle:
                  if ":" in line:
                      key, value = line.split(":", 1)
                      headers[key.strip().lower()] = value.strip()

          with open(sys.argv[2], encoding="utf-8") as handle:
              raw = handle.read()
          with open(sys.argv[3], encoding="utf-8") as handle:
              expected = json.load(handle)

          shard_names = expected.pop("catalogShards", [])
          if not isinstance(shard_names, list) or len(shard_names) > 100:
              raise SystemExit("Repository catalog shard manifest is invalid.")

          seen = set()
          catalog = expected.get("catalog", [])
          if not isinstance(catalog, list):
              raise SystemExit("Repository base catalog is invalid.")

          for item in catalog:
              if not isinstance(item, dict):
                  raise SystemExit("Repository catalog contains a non-object item.")
              try:
                  item_id = int(item.get("dataId"))
              except (TypeError, ValueError):
                  raise SystemExit("Repository catalog contains an invalid dataId.")
              if item_id < 1 or item_id in seen or not str(item.get("name", "")).strip():
                  raise SystemExit("Repository base catalog contains an invalid or duplicate dataId.")
              seen.add(item_id)

          for name in shard_names:
              if not isinstance(name, str) or not re.fullmatch(r"part-\d{2}\.json", name):
                  raise SystemExit("Repository catalog shard name is invalid.")
              with open(pathlib.Path(sys.argv[4]) / name, encoding="utf-8") as handle:
                  shard = json.load(handle)
              if not isinstance(shard.get("catalog"), list):
                  raise SystemExit("Repository catalog shard has no catalog array.")
              for item in shard["catalog"]:
                  if not isinstance(item, dict):
                      raise SystemExit("Repository shard contains a non-object item.")
                  try:
                      item_id = int(item.get("dataId"))
                  except (TypeError, ValueError):
                      raise SystemExit("Repository shard contains an invalid dataId.")
                  if item_id < 1 or item_id in seen or not str(item.get("name", "")).strip():
                      raise SystemExit("Repository shard contains an invalid or duplicate dataId.")
                  seen.add(item_id)
                  catalog.append(item)

          expected["catalog"] = catalog
          with open(sys.argv[2], encoding="utf-8") as handle:
              actual = json.load(handle)

          version = actual.get("version")
          digest = hashlib.sha256(raw.encode("utf-8")).hexdigest()
          if not isinstance(version, int) or version != expected.get("version"):
              raise SystemExit("Cloudflare version does not match the repository source. Configure CLOUDFLARE_API_TOKEN to publish the latest version.")
          if len(catalog) < 1 or len(catalog) > 500 or actual != expected:
              raise SystemExit("Cloudflare JSON content does not match the validated repository source.")
          if headers.get("x-coc-lio-content-version") != str(version):
              raise SystemExit("Cloudflare version header does not match the JSON body.")
          if headers.get("x-coc-lio-content-hash") != digest:
              raise SystemExit("Cloudflare SHA-256 header does not match the response body.")
          if headers.get("etag") != '"' + digest + '"':
              raise SystemExit("Cloudflare ETag does not match the response body.")
          ids = [int(item["dataId"]) for item in catalog]
          if len(ids) != len(set(ids)):
              raise SystemExit("Cloudflare catalog has duplicate IDs.")

          print("Cloudflare live endpoint and repository comparison passed.")
          print("Content version:", version)
          print("Catalog entries:", len(catalog))
          print("Catalog shards:", len(shard_names))
          print("SHA-256:", digest)
          print("Storage path:", headers.get("x-coc-lio-content-store", "unknown"))
          PY
