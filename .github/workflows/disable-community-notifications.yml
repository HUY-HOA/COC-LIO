name: Disable COC-LIO Community Notifications

on:
  push:
    branches:
      - main
    paths:
      - "functions/index.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disable-community-notifications:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Delete deployed community notification trigger
        env:
          FIREBASE_PROJECT_ID: coc-lio-73de9
        run: firebase functions:delete notifyCommunityMessage --region asia-southeast1 --project "$FIREBASE_PROJECT_ID" --force
