name: Deploy COC-LIO Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - "firestore.rules"

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Identify authenticated Google Cloud service account
        run: |
          node -e 'const fs = require("fs"); const path = process.env.GOOGLE_APPLICATION_CREDENTIALS; const credentials = JSON.parse(fs.readFileSync(path, "utf8")); console.log("Authenticated service account:", credentials.client_email || "not a service-account key"); console.log("Credential project:", credentials.project_id || "not set");'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore Rules only
        run: firebase deploy --only firestore:rules --project coc-lio-73de9 --non-interactive
