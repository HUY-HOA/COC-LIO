name: Deploy COC-LIO Security Rules

on:
  workflow_dispatch:
  push:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firestore-rules.yml"

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}


      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore and Storage Rules
        run: firebase deploy --only firestore:rules,storage --project coc-lio-73de9 --non-interactive
