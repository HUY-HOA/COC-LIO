name: Deploy COC-LIO Website

on:
  push:
    branches:
      - main
    paths:
      - "firebase.json"
      - ".firebaserc"
      - "website/**"
      - ".github/workflows/deploy-coclio-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Firebase deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Thiếu GitHub Actions secret FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          echo "Đã tìm thấy secret xác thực Firebase."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Ensure COC-LIO Hosting site exists
        shell: bash
        run: |
          if firebase hosting:sites:get coc-lio-73de9 --project coc-lio-73de9 >/dev/null 2>&1; then
            echo "Firebase Hosting site coc-lio-73de9 đã tồn tại."
          else
            echo "Đang tạo Firebase Hosting site coc-lio-73de9."
            firebase hosting:sites:create coc-lio-73de9 --project coc-lio-73de9 --non-interactive
          fi

      - name: Deploy website only
        run: firebase deploy --only hosting --project coc-lio-73de9 --non-interactive --message "Deploy COC-LIO public information pages"

      - name: Verify public pages and page contents
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local path="$1"
            local expected="$2"
            echo "Checking https://coc-lio-73de9.firebaseapp.com${path}"
            curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "https://coc-lio-73de9.firebaseapp.com${path}" -o /tmp/coclio-page
            grep -Fq "$expected" /tmp/coclio-page
          }
          verify_page "/" "Theo dõi tiến trình làng Clash of Clans"
          verify_page "/privacy" "Chính sách quyền riêng tư"
          verify_page "/terms" "Điều khoản sử dụng"
          verify_page "/robots.txt" "Sitemap: https://coc-lio-73de9.firebaseapp.com/sitemap.xml"
          verify_page "/sitemap.xml" "https://coc-lio-73de9.firebaseapp.com/privacy"
          echo "Tất cả 5 URL công khai và nội dung chính đã được xác minh."
