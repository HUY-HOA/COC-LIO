gradle.taskGraph.whenReady { graph ->
    println("COCLIO_TASK_TOTAL:" + graph.allTasks.size())
    System.out.flush()
}

gradle.taskGraph.afterTask { task, state ->
    def result = state.failure == null ? "OK" : "FAILED"
    println("COCLIO_TASK_DONE:" + task.path + ":" + result)
    System.out.flush()
}
